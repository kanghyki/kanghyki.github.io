permalink: /search/

<div id="search-list"></div>

<script type="module">
    import { Search } from "/js/search/search.js";
    import { Indexer } from "/js/search/indexer.js";
    import {
        applyMark,
        buildContextRegex,
        buildQueryRegex,
        clampSnippet,
        SNIPPET_JOINER,
    } from "/js/snippet-utils.js";

    function highlightSearchSnippet(content, query) {
        const sanitized_content_str = content
            .replace(/\[(.+)\]\(.*\)/gm, "$1")
            .replace(/```[\s\S]*?```/g, "");

        const contextRegex = buildContextRegex(query);
        if (!contextRegex) return "";
        const matched = sanitized_content_str.match(contextRegex);
        if (!matched) return "";

        const joined = clampSnippet(matched.join(SNIPPET_JOINER));
        const queryRegex = buildQueryRegex(query);
        if (!queryRegex) return "";
        return `… ${applyMark(joined, queryRegex)} …`;
    }

    function makeHTML(query, metadata_list) {
        if (metadata_list == null || metadata_list.length < 1)
            return "<h2>검색 결과 없음</h2>";

        const reg_exp = buildQueryRegex(query);
        if (!reg_exp) return "<h2>검색어를 입력해주세요.</h2>";

        function buildHierarchy(metadata) {
            if (!metadata) return "";
            if (Array.isArray(metadata.hierarchy) && metadata.hierarchy.length > 0) {
                return metadata.hierarchy.join(" › ");
            }
            const url = metadata.url || "";
            const decoded = decodeURI(url);
            if (decoded.startsWith("/wiki/")) {
                let path = decoded.replace(/^\/wiki\//, "");
                path = path.replace(/\/index$/, "");
                if (!path) return "ROOT";
                return `ROOT › ${path.replace(/\//g, " › ")}`;
            }
            return decoded.replace(/\//g, " › ").replace(/^ › /, "");
        }

        let inner_html_str = `<h2>검색 결과 (${metadata_list.length} 항목)</h2>`;
        inner_html_str += '<ul class="post-list">';
        for (const metadata of metadata_list) {
            inner_html_str += '<li class="post-list-item">';
            inner_html_str += `<a href="${metadata.url}">`;
            inner_html_str += `<span class="post-title">${applyMark(
                metadata.title,
                reg_exp
            )}</span>`;
            /* 날짜를 2024-09-20 같이 표현함 */
            const updated = metadata.updated.replace(
                /^(\d{4}-\d{2}-\d{2}).*$/,
                "$1"
            );
            inner_html_str += `<span style="float: right;">${updated}</span>`;
            inner_html_str += `<div class="post-hier">${applyMark(
                buildHierarchy(metadata),
                reg_exp
            )}</div>`;
            inner_html_str += `<div class="post-snip">${highlightSearchSnippet(
                /* content = */ metadata.summary + metadata.body,
                /* query = */ query
            )}</div>`;
            inner_html_str += `</a>`;
            inner_html_str += "</li>";
        }
        inner_html_str += "</ul>";
        return inner_html_str;
    }

    (async () => {
        const engine = new Search(new Indexer());
        try {
            document.getElementById("search-list").innerHTML =
                "<h2>인덱싱...</h2>";
            const search_index_res = await fetch("/data/search-index.json");
            const search_index_json = await search_index_res.json();
            engine.indexer.fromJson(search_index_json);
        } catch (e) {
            console.error(e);
            document.getElementById("search-list").innerHTML =
                "<h2>인덱싱 에러</h2>";
            return;
        }
        const params = new URLSearchParams(window.location.search);
        const query = (params.get("searchString") || "").trim();
        if (!query) {
            document.getElementById("search-list").innerHTML =
                "<h2>검색어를 입력해주세요.</h2>";
            return;
        }
        document.getElementById("search-list").innerHTML = "<h2>검색중...</h2>";
        const file_names = engine.searchFilesByQuery(query);
        const metadata_list = await engine.fetchMetadataForFiles(file_names);

        document.getElementById("search-list").innerHTML = makeHTML(
            query,
            metadata_list
        );
    })();
</script>
