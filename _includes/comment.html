<div class="giscus"></div>

<script>
    (function () {
        const prefersDark =
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches;
        const theme = prefersDark ? "dark_dimmed" : "light";

        const script = document.createElement("script");
        script.src = "https://giscus.app/client.js";
        script.async = true;
        script.crossOrigin = "anonymous";
        script.setAttribute("data-repo", "{{ site.giscus.repo }}");
        script.setAttribute("data-repo-id", "{{ site.giscus.repo_id }}");
        script.setAttribute("data-category", "{{ site.giscus.category }}");
        script.setAttribute("data-category-id", "{{ site.giscus.category_id }}");
        script.setAttribute("data-mapping", "pathname");
        script.setAttribute("data-strict", "0");
        script.setAttribute("data-reactions-enabled", "1");
        script.setAttribute("data-emit-metadata", "0");
        script.setAttribute("data-input-position", "bottom");
        script.setAttribute("data-theme", theme);
        script.setAttribute("data-lang", "ko");
        document.body.appendChild(script);

        const setGiscusTheme = (nextTheme) => {
            const iframe = document.querySelector("iframe.giscus-frame");
            if (!iframe) return;
            iframe.contentWindow.postMessage(
                { giscus: { setConfig: { theme: nextTheme } } },
                "https://giscus.app"
            );
        };

        if (window.matchMedia) {
            window.matchMedia("(prefers-color-scheme: dark)").addEventListener(
                "change",
                (event) => {
                    setGiscusTheme(event.matches ? "dark_dimmed" : "light");
                }
            );
        }
    })();
</script>
