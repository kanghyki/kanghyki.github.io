---
layout: default
permalink: /tag/
---

<div>
    <ul id="tag-list" class="tag-list"></ul>
</div>

<div id="tag-collection"></div>

<style>
    .tag-list {
        display: flex;
        flex-wrap: wrap;
    }

    .tag-list li {
        list-style: none;
        margin-right: 1em;
    }

    .post-item .post-excerpt {
        color: var(--cloudy-text-color);
        font-size: small;
    }
</style>

<script type="module">
    import { toDataUrl, toTagUrl } from "/js/path-utils.js";
    import { fetchJson, setHTML } from "/js/client-utils.js";
    (function () {
        fetchJson(`/data/tag_count.json`).then((data) => {
            if (!data) {
                return;
            }
            const tags = data;

            let template = "";
            for (let i = 0; i < tags.length; i++) {
                const tag = tags[i];
                template += `
                <li class="tag-item">
                    <a href="#${encodeURIComponent(tag.name)}" data-tag="${tag.name}">${tag.name}<sup>${tag.size}</sup></a>
                </li>`;
            }
            setHTML("tag-list", template);
            wireTagList();

            showInitTag();
        });
    })();

    function showTag(tagName) {
        fetchJson(toTagUrl(tagName)).then((data) =>
            createLinks(data, tagName)
        );
    }

    function createLinks(data, tagName) {
        if (data == null) {
            return;
        }

        const documents = [];

        let listItems = "";
        for (let i = 0; i < data.length; i++) {
            const idText = getDocumentElementId(tagName, data[i]);
            listItems += `<li id="${idText}" class="post-item"></li>`;
        }
        const template = `
            <h3>${tagName}</h3>
            <ul class="post-list"> ${listItems} </ul>`;

        setHTML("tag-collection", template);

        for (let i = 0; i < data.length; i++) {
            setTimeout(() => insertDocumentLink(data[i], tagName), 0);
        }
    }

    function insertDocumentLink(documentId, tagName) {
        fetch(toDataUrl("metadata", documentId))
            .then((response) => response.json())
            .then(function (data) {
                if (data == null) {
                    return;
                }
                const d = data;

                const updatedDate = d.updated.replace(
                    /^(\d{4}-\d{2}-\d{2}).*$/,
                    "$1"
                );
                const summaryText =
                    d.summary == null || /^\s*$/.test(d.summary)
                        ? ""
                        : d.summary;
                const subDocument =
                    d.children && d.children.length > 0
                        ? `- 서브 문서: ${d.children.length} 개`
                        : "";

                const link = `
                <a class="post-link" href="${d.url}">
                    <span>${d.title}</span>
                    <div class="post-meta" style="float: right;" title="${d.updated}">${updatedDate}</div>
                    <div class="post-excerpt">${summaryText}</div>
                    <div class="post-sub-document">${subDocument}</div>
                </a>`;

                const idText = getDocumentElementId(tagName, documentId);
                document.getElementById(idText).innerHTML = link;
            })
            .catch(function (error) {
                console.error(error);
            });
    }

    function getDocumentElementId(tagName, documentId) {
        return `tag-${tagName}-${documentId}`;
    }

    function showInitTag() {
        const url = window.location.href;
        const req = /#([^\s]+)$/.exec(url);
        if (Array.isArray(req)) {
            let tagName = decodeURI(req.pop());
            showTag(tagName);
        }
    }

    function wireTagList() {
        const list = document.getElementById("tag-list");
        if (!list) return;
        list.addEventListener("click", (event) => {
            const link = event.target.closest("a[data-tag]");
            if (!link) return;
            event.preventDefault();
            const tagName = link.dataset.tag;
            if (!tagName) return;
            history.replaceState(null, "", `#${encodeURIComponent(tagName)}`);
            showTag(tagName);
        });
    }
</script>
