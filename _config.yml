# Build settings
plugins:
  - jekyll-feed

collections:
  wiki:
    output: true
    permalink: /:collection/:path/

defaults:
  - scope:
      path: ""
      type: "wiki"
    values:
      layout: "wiki"
      latex: true

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
  toc_levels: 1..6
  hard_wrap: true
  #   syntax_highlighter_opts:
  #     block:
  #       line_numbers: true

exclude:
  - scripts

include:
  - _wiki/assets
  - data
